# Image datasets NutriSnap can train on. A config selects them with `data.sources: [food101, indian43]`.
# Labels from different datasets are merged into one label space; `aliases` maps a dataset's
# label onto an existing class (e.g. Indian "burger" == Food-101 "hamburger").
# Only datasets with a clear, permissive licence are listed.

food101:
  hf: ethz/food101
  dir: food101_256                 # data/cache/<dir>; same folder the original Food-101 export uses
  splits: {train: train, validation: test}   # HF "validation" is the official Food-101 test split
  license: "Research use (Food-101, Bossard et al., ECCV 2014; images from foodspotting.com)"
  url: https://data.vision.ee.ethz.ch/cvl/datasets_extra/food-101/
  aliases: {}

indian43:
  hf: SohlHealth/enhanced-indian-food-classification
  dir: indian43_256
  splits: {train: train, validation: train, test: test}   # their val is folded into our train pool
  license: CC-BY-4.0
  url: https://huggingface.co/datasets/SohlHealth/enhanced-indian-food-classification
  aliases:
    burger: hamburger              # pizza, samosa, fried_rice, chicken_curry already share Food-101 names

indianfoods15:
  hf: bharat-raghunathan/indian-foods-dataset
  dir: indianfoods15_256
  splits: {train: train, test: test}
  license: CC0-1.0
  url: https://huggingface.co/datasets/bharat-raghunathan/indian-foods-dataset
  aliases:                         # 10 of its 15 dishes already exist under our names
    cholebhature: chole_bhature
    dal: dal_tadka
    dosa: masala_dosa
    kathiroll: kaathi_rolls
    kofta: malai_kofta
    naan: butter_naan
    pakora: pakode
    panipuri: paani_puri
    pavbhaji: pav_bhaji
    vadapav: vada_pav
  drop: [paneer]                   # "paneer" mixes several different paneer dishes

cafsd:
  # Central Asian Food Scenes: photos of whole tables with a box per item. We crop the named dishes.
  type: yolo_crops
  hf: issai/Central_Asian_Food_Scenes_Dataset
  dir: cafsd_256
  splits: {train: train, valid: train, test: test}
  license: CC-BY-4.0
  url: https://huggingface.co/datasets/issai/Central_Asian_Food_Scenes_Dataset
  min_box: 0.12                    # crop only boxes at least 12% of the photo's width and height
  min_images: 40                   # drop a dish with fewer crops than this
  keep:                            # their class -> our dish (anything not listed is ignored)
    plov: plov
    manty: dumplings
    hinkali: dumplings
    lagman-fried: lagman
    lagman-w-soup: lagman
    beshbarmak: beshbarmak
    samsa: samsa
    borsch: borscht
    cheburek: cheburek
    hachapuri: khachapuri
    vareniki: vareniki
    syrniki: syrniki
    olivie: olivier_salad
    shorpa: shorpa
    shorpa chicken: shorpa
    doner-lavash: doner_kebab
    doner-nan: doner_kebab
    beef shashlyk: kebab
    beef shashlyk-v: kebab
    chicken shashlyk: kebab
    chicken shashlyk-v: kebab
    minced meat shashlyk: kebab
    pizza: pizza
    sushi: sushi
    hamburger: hamburger
    hot dog: hot_dog
    french fries: french_fries
    baklava: baklava
    hummus: hummus
    waffles: waffles
    pancakes: pancakes
    onion rings: onion_rings
    wings: chicken_wings
    ice-cream: ice_cream

frcitems:
  # Drinks and fruit cut out of the Food Recognition 2022 phone photos already converted by scripts/prepare_foodrec.py
  # (MyFoodRepo, CC-BY-4.0). Only plate-model classes whose source labels are clean are used ("apple" also holds plums
  # and fruit salad, "bread" holds crepes and waffles, "egg" overlaps omelette: those are left out).
  type: local_seg_crops
  root: foodrec2022
  names_from: foodseg103/data.yaml
  dir: frcitems_256
  splits: {train: train, val: test}      # their validation photos become our real-phone-photo test set
  license: CC-BY-4.0
  url: https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2022.875143/full
  min_box: 0.2
  max_per_class: 1500
  min_images: 40
  keep:
    coffee: coffee
    tea: tea
    juice: juice_or_soda
    milk: milk
    wine: wine_or_beer
    banana: banana
    orange: orange
    strawberry: strawberries
    grape: grapes
    kiwi: kiwi
    pear: pear
    peach: peach
    pineapple: pineapple
    watermelon: watermelon
    mango: mango
    cherry: cherries
    blueberry: blueberries

turkish25:
  hf: yunusserhat/TurkishFoods-25
  dir: turkish25_256
  splits: {train: train, eval: train, test: test}
  license: Apache-2.0
  url: https://huggingface.co/datasets/yunusserhat/TurkishFoods-25
  aliases:                         # 3 of its 25 dishes already exist under our names
    baklava: baklava
    manti: dumplings
    kebap: kebab
    pirinc_pilavi: rice_pilaf

mmfood:
  # MM-Food-100K: ~100k crowd-sourced phone photos with a dish name (AI-written, reviewed by people). Only clear, frequent
  # names are used, merged into one label each; vague ones ("mixed asian cuisine", "meat stew", "birthday cake") are skipped.
  type: mmfood_names
  hf: Humanbased-AI/MM-Food-100K
  csv: MM-Food-100K.csv
  dir: mmfood_256
  license: OpenRAIL
  url: https://huggingface.co/datasets/Humanbased-AI/MM-Food-100K
  # photos are full-size (~1.45 MB each, the server can't send smaller ones): only new dishes, 100 photos each,
  # keeps the download to ~4.8 GB (photos are shrunk to 256 px as they arrive, so disk use stays ~100 MB)
  max_per_class: 100               # new dishes, on top of the warm-started model
  max_per_class_extra: 0           # no extra photos for dishes the model already knows (they have thousands)
  test_frac: 0.1
  min_images: 60
  names:                           # our label: [their dish names]
    # new dishes
    apple: [apple, apples]
    noodle_soup: [noodle soup, beef noodle soup, spicy noodle soup, seafood noodle soup, noodle soup with meat, chicken noodle soup, shrimp noodle soup]
    hot_pot: [hot pot, spicy hot pot]
    stir_fried_noodles: [stir-fried noodles, noodle stir-fry, noodle stir fry, stir-fried noodles with vegetables]
    fried_chicken: [fried chicken]
    lychee: [lychee]
    meat_stir_fry: [stir-fried chicken with vegetables, beef stir-fry, stir-fried meat with vegetables, chicken stir-fry, stir-fried meat and vegetables, stir-fried vegetables with meat, stir-fried beef with vegetables, stir-fried pork with vegetables, spicy beef stir-fry, stir-fried chicken]
    shrimp_stir_fry: [shrimp stir-fry, shrimp and vegetable stir-fry]
    stir_fried_vegetables: [vegetable stir-fry, stir-fried greens, stir-fried vegetables, stir-fried cabbage, sautéed greens, stir-fried green beans]
    braised_pork: [braised pork belly, braised pork]
    steamed_fish: [steamed fish, steamed fish with vegetables]
    fried_fish: [fried fish]
    grilled_fish: [grilled fish]
    instant_noodles: [instant noodles]
    steamed_buns: [steamed buns, steamed bun]
    crawfish: [spicy crawfish, crawfish, crawfish boil]
    boiled_eggs: [boiled eggs, boiled egg]
    corn_on_the_cob: [corn on the cob]
    mapo_tofu: [mapo tofu]
    roast_chicken: [roasted chicken, roasted chicken with vegetables]
    egg_tart: [egg tart, custard tart, custard tarts]
    sweet_and_sour_meat: [sweet and sour chicken, sweet and sour pork]
    vegetable_soup: [vegetable soup]
    chicken_soup: [chicken soup]
    beef_stew: [beef stew]
    tomato_egg_stir_fry: [tomato and egg stir-fry, scrambled eggs with tomatoes]
    chicken_feet: [spicy chicken feet, braised chicken feet]
    fruit_salad: [fruit salad]
    dragon_fruit: [dragon fruit]
    zongzi: [zongzi]
    chicken_rice: [chicken rice, hainanese chicken rice]
    rice_porridge: [rice porridge]
    steamed_crab: [steamed crab, steamed crabs]
    potato_chips: [potato chips]
  extra_names:                     # more phone photos for dishes the model already knows
    dumplings: [dumplings, steamed dumplings]
    gyoza: [fried dumplings]
    fried_rice: [fried rice, shrimp fried rice, vegetable fried rice]
    pizza: [pizza, pepperoni pizza, cheese pizza, vegetable pizza]
    sushi: [sushi, sushi platter, sushi rolls]
    sashimi: [sashimi, sashimi platter]
    ramen: [ramen]
    pho: [pho]
    hamburger: [hamburger, cheeseburger]
    steak: [grilled steak, grilled steak with vegetables]
    chicken_wings: [fried chicken wings, glazed chicken wings, grilled chicken wings, chicken wings]
    french_fries: [french fries]
    kebab: [grilled meat skewers, grilled skewers, mixed skewers, grilled chicken skewers]
    peking_duck: [roasted duck, roast duck]
    spring_rolls: [spring rolls]
    chocolate_cake: [chocolate cake]
    oysters: [oysters, baked oysters]
    bibimbap: [bibimbap]
    biryani: [biryani]
    spaghetti_bolognese: [spaghetti bolognese]
    white_rice: [cooked white rice]
    ice_cream: [ice cream, soft serve ice cream]
    baby_back_ribs: [barbecue ribs]
    watermelon: [watermelon, watermelon slices, watermelon slice]
    strawberries: [strawberries, strawberry]
    grapes: [grapes, green grapes]
    banana: [bananas, banana]
    cherries: [cherries]
    peach: [peach, peaches, fresh peaches]
    mango: [mango]
    orange: [oranges, orange]
    blueberries: [blueberries]
    pear: [pear, pears]
    pineapple: [pineapple]
    milk: [whole milk, milk]
    coffee: [iced coffee]
