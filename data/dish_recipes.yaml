# Standard recipes for dishes whose nutrition was only borrowed from "the most similar food" (or was clearly wrong).
# Applied to docs/data/foods.json + micros.json by scripts/dish_recipes.py (run by build_web.py, build_micros.py and
# build_world_dishes.py). Each entry is one typical home or restaurant batch:
#
#   parts:   {ingredient: grams}. An ingredient is a cooking staple from data/recipe_ingredients.csv (ing_*, USDA SR
#            Legacy, raw) or any food in docs/data/foods.json by key (fndds_*, dish classes) or exact USDA name.
#            Rice, noodles, pasta, lentils and meats are taken COOKED where USDA has them, so their weight is the
#            weight on the plate; oil is what ends up in the dish (absorbed oil for fried food).
#   yield:   cooked weight / weight of the parts, when raw parts lose water (baking, frying, simmering down); default 1.
#   serving: one typical portion in g.
#   same_as: use another food's values instead of a recipe (the borrowed match was simply the wrong food).
#
# Values per 100 g = sum(parts) / (sum of part weights x yield). Recipes are typical, not exact: home cooking varies,
# which is why the app has Light / Normal / Rich and "My recipes".

