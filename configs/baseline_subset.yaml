# Fast baseline: 10 classes x 200 train imgs, frozen-ish fine-tune on CPU in minutes.
experiment: baseline_subset
data:
  name: subset10
  short_side: 256
  num_classes: 10
  class_selection: random      # random but seeded -> reproducible, avoids alphabetical bias
  train_per_class: 200
  val_per_class: 50
  test_per_class: 100
  val_frac: 0.1
  seed: 42
model:
  backbone: efficientnet_b0
  pretrained: true
  drop_rate: 0.2
train:
  img_size: 224
  epochs: 6
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 1
  freeze_backbone_epochs: 0
  amp: true
  patience: 3
  num_workers: 4
  seed: 42
augment:
  randaugment: false
  color_jitter: 0.0
  random_erasing: 0.0
