# GPU backbone ablation on FULL Food-101 (all 101 classes, ~68k train images).
# Identical data, schedule and augmentation; only the backbone and its standard LR differ.
# Batch sizes fit a 6-8 GB laptop GPU with AMP; lower with --set train.batch_size=N if you hit out-of-memory.
experiment: gpu_ablation_effnet_b0
data:
  name: full
  short_side: 256
  num_classes: null
  val_frac: 0.1
  seed: 42
model:
  backbone: efficientnet_b0
  pretrained: true
  drop_rate: 0.2
train:
  img_size: 224
  epochs: 6
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 1
  freeze_backbone_epochs: 0
  amp: true
  patience: 3
  num_workers: 4
  seed: 42
augment:
  randaugment: true
  color_jitter: 0.2
  random_erasing: 0.25
