# Improved CPU-trainable model used by the app: ALL 101 classes, capped images per class,
# stronger augmentation, longer schedule. (Full-data GPU run: configs/full_gpu.yaml)
experiment: improved_all101
data:
  name: all101_cap150
  short_side: 256
  num_classes: null
  train_per_class: 150
  val_per_class: 30
  test_per_class: 100
  val_frac: 0.1
  seed: 42
model:
  backbone: efficientnet_b0
  pretrained: true
  drop_rate: 0.3
train:
  img_size: 224
  epochs: 8
  batch_size: 48
  lr: 1.0e-3
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 1
  freeze_backbone_epochs: 0
  amp: true
  patience: 3
  num_workers: 4
  seed: 42
augment:
  randaugment: true
  color_jitter: 0.2
  random_erasing: 0.1
